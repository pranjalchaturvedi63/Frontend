<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        //For in loop (index)
        //for of loop (value)
        //ForEach loop 
        //all these loops work on array

        let arr=[1,3,5,6];

        for(let index in arr){
            document.writeln(arr[index]);
        }
        document.writeln("<br>");

        for(let value of arr){
            document.writeln(value);
        }
            document.writeln("<br>");

        arr.forEach((element)=>{
            document.writeln(element);
        });

    </script>
    
</body>
</html>
