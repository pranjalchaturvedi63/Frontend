<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
</head>
<body>
    <script>
        let day=prompt("Enter number of a day in a week");
        switch(day){
            case "1":
                document.writeln("MONDAY");
                break;
            case "2":
                document.writeln("TUESDAY");
                break;
            case "3":
                document.writeln("WEDNESDAY");
                break;
            case "4":
                document.writeln("THURSDAY");
                break;
            case "5":
                document.writeln("FRIDAY");
                break;
            case "6":
                document.writeln("SATURDAY");
                break;
                
            case "7":
                document.writeln("SUNDAY");
                break;
            default:
                document.writeln("Invalid argument");
        }
    </script>
    
</body>
</html>
